
name: Update SEC filings

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect SEC filings
        run: python scripts/fetch_sec.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      - name: Commit SEC data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sec_filings.json
          git diff --cached --quiet || git commit -m "Update SEC filings"
          git push
