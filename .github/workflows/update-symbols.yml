name: Update Nasdaq symbol directory

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and classify official listings
        run: |
          python - <<'PY'
          import csv, json, urllib.request, datetime, pathlib, io, re
          from collections import Counter

          sources = {
              "NASDAQ": "https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt",
              "NYSE American": "https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt"
          }

          def classify(name):
              n = " ".join(name.lower().replace(",", " ").split())
              words = set(n.split())

              excluded_words = {
                  "warrant", "warrants", "right", "rights",
                  "unit", "units", "preferred", "note", "notes",
                  "debenture", "debentures", "bond", "bonds"
              }

              excluded_phrases = [
                  "exchange traded fund", "exchange-traded fund",
                  "closed-end fund", "closed end fund",
                  "investment company", "investment trust",
                  "mutual fund", "money market fund",
                  "shares of beneficial interest",
                  "subscription receipt"
              ]

              if words & excluded_words:
                  return None

              if any(p in n for p in excluded_phrases):
                  return None

              if "etf" in words or "fund" in words:
                  return None

              adr_phrases = [
                  "american depositary share",
                  "american depositary receipt",
                  "american depository share",
                  "american depository receipt",
                  "global depositary share",
                  "global depositary receipt",
                  "global depository share",
                  "global depository receipt"
              ]

              if any(p in n for p in adr_phrases):
                  return "ADR"

              if "adr" in words or "ads" in words:
                  return "ADR"

              common_phrases = [
                  "common stock", "common shares",
                  "ordinary share", "ordinary shares"
              ]

              if any(p in n for p in common_phrases):
                  return "보통주"

              return None

          symbols = {}

          for exchange, url in sources.items():
              req = urllib.request.Request(
                  url, headers={"User-Agent": "Mozilla/5.0 microcap-scanner"}
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  raw = response.read().decode("utf-8-sig")

              for row in csv.reader(io.StringIO(raw), delimiter="|"):
                  if not row or row[0].startswith("File Creation Time"):
                      continue
                  if row[0] in ("Symbol", "ACT Symbol"):
                      continue

                  if exchange == "NASDAQ":
                      if len(row) < 8:
                          continue
                      ticker, name = row[0].strip(), row[1].strip()
                      if row[3] == "Y" or row[6] == "Y" or row[7] == "Y":
                          continue
                  else:
                      if len(row) < 8 or row[2] != "A":
                          continue
                      ticker, name = row[0].strip(), row[1].strip()
                      if row[4] == "Y" or row[6] == "Y":
                          continue

                  security_type = classify(name)
                  if ticker and security_type:
                      symbols[ticker] = {
                          "ticker": ticker,
                          "name": name,
                          "exchange": exchange,
                          "security_type": security_type
                      }

          if not symbols:
              raise RuntimeError("No symbols collected")

          types = Counter(x["security_type"] for x in symbols.values())
          exchanges = Counter(x["exchange"] for x in symbols.values())

          data = {
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source": "NasdaqTrader",
              "count": len(symbols),
              "counts_by_type": dict(types),
              "counts_by_exchange": dict(exchanges),
              "symbols": sorted(symbols.values(), key=lambda x: x["ticker"])
          }

          out = pathlib.Path("data/listings.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")

          print("TOTAL:", len(symbols))
          print("TYPES:", dict(types))
          print("EXCHANGES:", dict(exchanges))
          PY

      - name: Commit updated directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json
          git diff --cached --quiet || git commit -m "Improve stock and ADR classification"
          git push
