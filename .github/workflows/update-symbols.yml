name: Update Nasdaq symbol directory

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download, classify and filter official listings
        run: |
          python - <<'PY'
          import csv, json, urllib.request, datetime, pathlib, io

          sources = {
              "NASDAQ": "https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt",
              "NYSE American": "https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt",
          }

          def classify(name):
              n = name.lower()
              if any(k in n for k in ("warrant", "right", "unit", "preferred", "depositary receipt", "note")):
                  return None
              if any(k in n for k in ("american depositary share", "american depositary shares", "ads representing", "adr")):
                  return "ADR"
              if any(k in n for k in ("common stock", "ordinary share", "ordinary shares")):
                  return "보통주"
              return None

          symbols = {}
          for exchange, url in sources.items():
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 microcap-scanner"})
              with urllib.request.urlopen(req, timeout=40) as response:
                  raw = response.read().decode("utf-8-sig")

              for row in csv.reader(io.StringIO(raw), delimiter="|"):
                  if not row or row[0].startswith("File Creation Time"):
                      continue

                  if exchange == "NASDAQ":
                      if len(row) < 7 or row[3] == "Y" or row[6] == "Y":
                          continue
                      ticker, name = row[0].strip(), row[1].strip()
                  else:
                      if len(row) < 7 or row[2] != "A" or row[4] == "Y" or row[6] == "Y":
                          continue
                      ticker, name = row[0].strip(), row[1].strip()

                  security_type = classify(name)
                  if ticker and security_type:
                      symbols[ticker] = {
                          "ticker": ticker,
                          "name": name,
                          "exchange": exchange,
                          "security_type": security_type
                      }

          data = {
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source": "NasdaqTrader Symbol Directory",
              "count": len(symbols),
              "policy": "Common stocks and ADRs included; ETFs, warrants, units, preferreds and rights excluded",
              "symbols": sorted(symbols.values(), key=lambda x: x["ticker"])
          }

          out = pathlib.Path("data/listings.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(data, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print(f"Wrote {len(symbols)} common-stock/ADR symbols")
          PY

      - name: Commit updated directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json
          git diff --cached --quiet || git commit -m "Update common stock and ADR directory"
          git push
