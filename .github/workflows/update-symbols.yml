name: Update Nasdaq symbol directory

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and parse official listings
        run: |
          python - <<'PY'
          import csv, json, urllib.request, datetime, pathlib, io

          sources = {
              "NASDAQ": "https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt",
              "NYSE American": "https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt"
          }
          symbols = {}
          for exchange, url in sources.items():
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=40) as response:
                  raw = response.read().decode("utf-8-sig")
              for row in csv.reader(io.StringIO(raw), delimiter="|"):
                  if not row or row[0].startswith("File Creation Time"):
                      continue
                  if exchange == "NASDAQ":
                      if len(row) < 7 or row[3] == "Y" or row[6] == "Y":
                          continue
                  else:
                      if len(row) < 7 or row[2] != "A" or row[4] == "Y" or row[6] == "Y":
                          continue
                  ticker, name = row[0].strip(), row[1].strip()
                  if ticker:
                      symbols[ticker] = {"ticker": ticker, "name": name, "exchange": exchange}

          data = {
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source": "NasdaqTrader",
              "count": len(symbols),
              "symbols": sorted(symbols.values(), key=lambda x: x["ticker"])
          }
          path = pathlib.Path("data/listings.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")
          print("Updated symbols:", len(symbols))
          PY

      - name: Commit updated directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json
          git diff --cached --quiet || git commit -m "Update Nasdaq symbol directory"
          git push
